aid: booqed
name: Booqed
description: >-
  BOOQED is a Hong Kong-based proptech company building flexible workplace
  technology that turns underutilized real estate into bookable, on-demand
  workspace. Its flagship product QUBIC is a line of sound-isolating, modular
  smart booths and work pods (for one to six people) with soundproofing,
  ventilation, power, and a proprietary access-control system managed through a
  mobile web app. Alongside the hardware, BOOQED offers space-management SaaS
  that makes existing meeting rooms and desks bookable and trackable with
  utilization analytics, plus the BOOQED app for individuals to book hot desks
  and meeting rooms on demand across Hong Kong, Singapore, and Shenzhen. Founded
  by David Wong, Charles Oh, and Ken Huang, BOOQED went through the Colliers and
  Techstars proptech accelerator and raised seed funding in 2019. This profile
  is maintained in the API Evangelist network; BOOQED does not currently publish
  a public developer API, SDKs, or developer portal.
